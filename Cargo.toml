[workspace]
resolver = "2"
members = ["crates/*", "apps/verity-service", "apps/verity-cli", "tools/probes", "tools/stressors", "tools/framegen"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
verity-core = { path = "crates/verity-core" }
verity-sys = { path = "crates/verity-sys" }
verity-ipc = { path = "crates/verity-ipc" }
verity-telemetry = { path = "crates/verity-telemetry" }
verity-store = { path = "crates/verity-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
tracing-appender = "0.2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "sync", "time", "macros", "process"] }
windows-service = "0.8"
