[package]
name = "verity-sys"
version.workspace = true
edition.workspace = true
publish = false

[features]
# Undocumented APIs (CLAUDE.md), each with a runtime check and a fallback.
default = ["undocumented"]
undocumented = []

[dependencies]
verity-core.workspace = true
tokio.workspace = true
# The `implement` macro for the Disk Cleanup progress callback expands to windows_core paths.
windows-core = "0.61"

[dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_EventLog",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Time",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_LegacyWindowsEnvironmentFeatures",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Power",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Rpc",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_Wmi",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_LibraryLoader",
    "Win32_System_RemoteDesktop",
    "Win32_System_Restore",
    "Win32_System_Pipes",
    "Win32_Media_Audio",
]
