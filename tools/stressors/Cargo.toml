[package]
name = "verity-stressors"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "stress"
path = "src/main.rs"

# Test tooling: `stress hitch` signals framegen's named event (Win32), so its
# calls live here, as framegen's do (docs/notes/decisions.md).
[dependencies.windows]
version = "0.61"
features = ["Win32_Foundation", "Win32_System_Threading"]
